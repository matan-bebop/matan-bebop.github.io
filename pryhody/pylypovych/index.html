<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF8">
  <title>Пригода Микити Пилиповича</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="styles/pylypovych.css" rel="stylesheet" />
</head>

<body>

<div id="page" class="width-75" style="margin: auto">

<p class="stage-directions first-par"></p>

<div id="prompt_line" class="active"
     style="display:flex; align-items: center;
            margin-top: 1em; padding-bottom: 1em">
  <div style="flex:none" class="character">
     Внутрішній голос:&nbsp
  </div>
  <input type="text" id="input"
	 onkeypress='if(event.key == "Enter") { enter() }'
	 autofocus onfocusout="refocus()"
	 style="width:100%">
</div> <!-- prompt_line -->

</div> <!-- page -->

<script src="../swipl-bundle-devel.js"></script>
<script src="../mistral.js"></script>

<script>

let resolve_input = undefined
var promise_read_input = new Promise(r => {resolve_input = r})

var swipl;
var swipl_options = {
  arguments: ["-q"],
  on_output: function(msg,stream) {
    console.log(msg)
    if (stream == "stdout") {
      const pars = document.getElementsByTagName("p"),
            last_par = pars[pars.length-1]
      last_par.appendChild(document.createTextNode(msg))
      if (msg.charCodeAt(msg.length-1) == 10) {
        const br = document.createElement("br")
        last_par.appendChild(br)
      }
    }
  }
};

async function new_game()
{
  swipl = await SWIPL(swipl_options)

  await swipl.prolog.load_scripts() /* переозначити ввід і вивід, тощо */
  await swipl.prolog.consult("pylypovych-web.qlf")
  await swipl.prolog.consult("mistral.pl")

  const url_params = new URLSearchParams(window.location.search)
  if(mistral_key = url_params.get("key"))
    await swipl.prolog.forEach('assertz(мм_ключ("' + mistral_key + '")).')

  await swipl.prolog.forEach("гра.").catch(error => block())
  // Чому я все одно отримую Unhandled promise rejection по ванільному halt?
}

new_game();


const page = document.getElementById("page")
const prompt_line = document.getElementById("prompt_line")
const input = document.getElementById("input")

let dialogue_starts = false

function refocus() { setTimeout(function () { input.focus() }, 0) }

const game = {
  set running(to_running) {
    prompt_line.className = to_running? 'muted' : 'active'
  },
  get running() { return prompt_line.className == 'muted' }
}

function enter() {
  if(game.running) return

  /* It can be hard to input proper apostrophe symbol, and it seems that is
     merely impossible on iPhone. So, first, change every apostrophe-like
     symbol (except ") to the proper apostrophe */
  /* TODO: properly treat quoted words and move this to Prolog, possibly by
     compiling it with PCRE. */
  input.value = input.value.replace(/[‘’’']/g, "ʼ")

  inner_voice_says(input.value)
  resolve_input(input.value)
  promise_read_input = new Promise(r => {resolve_input = r})
  input.value = ""
  new_paragraph()

  game.running = true
}

function block() {
  input.style.display = "block"
}

function capitalize(s) { return s && s[0].toUpperCase() + s.slice(1) }
/* Ще треба б додавати в кінці крапочку, як нема. Але тоді парсер має
   розуміти команди з крапкою в кінці, щоби не плутати гравця */

/* Fucking iPhone scrolls about 5-6em before the element when the page is longer
   than one screen. Moreover, that amount depends on the input box font size. */
if(navigator.userAgent.includes("iPhone")) {
  prompt_line.style.paddingBottom = "15ex"
}

function grow(el) {
  page.insertBefore(el, prompt_line)
  prompt_line.scrollIntoView(false)
}

function new_paragraph() {
  const	new_par = document.createElement("p")

  if(dialogue_starts) {
    new_par.className = "dialogue"
    dialogue_starts = false
  } else new_par.className = "stage-directions"

  grow(new_par)
}

function span(style, text) {
  let el = document.createElement("span")
  el.className = style; el.innerText = text
  return el
}

function continue_with_span(style, text) {
  const pars = document.getElementsByTagName("p")
  const last_par = pars[pars.length-1]
  last_par.appendChild(span(style, text))
}

function inner_voice_says(cmd) {
  const parsable = swipl.prolog.call('розбити_на_слова("' + cmd + '", Слова), phrase(команда(_), Слова)')

  console.log("Внутрішній голос: ", cmd)

  if (parsable) {
    const new_par = document.createElement("p")
    new_par.appendChild(span("character", 'Внутрішній голос: '))
    new_par.appendChild(span("command", capitalize(cmd)))
    grow(new_par)
  }
  else {
    swipl.prolog.call('каже("Внутрішній голос",'
                            + '"' + capitalize(cmd) + '"),'
                      + 'flush_output.')
  }
}

function finish_in_progress(style) {
  const el = document.getElementsByClassName("in_progress")[0]
  if (el) { console.log(el); el.className = style }
}

</script>


<script type="text/prolog" id="aux.pl">

/* Завантажується _перед_ .qlf-модулем і переозначує потрібні предикати */

:- multifile зчитати_рядок/1, пустий_рядок/0, каже/2, написати_втупу/2,
	     abort/0, заходить/1.

зчитати_рядок(Стр) :- !,
	js_script("game.running = false", _),
	% Чекати на введення
	Promise := promise_read_input, await(Promise, Стр).

пустий_рядок :- !,
	flush_output, % Заставити SWIPL вилити буфер виводу
	_ := new_paragraph().
% TODO: після Enter, виводиться абзац -> пустий рядок який залишається висіти

каже(_Хто, _Що) :-
	js_script("dialogue_starts = true", _),
	fail. % Перейти до каже/2 у грі

написати_втупу(команда, Щось) :- !,
	flush_output,
	atom_string(Щось, Стр),
	_ := console.log(Стр),
	_ := continue_with_span("command", Стр).

написати_втупу(сцена, Щось) :- !,
	flush_output,
	atom_string(Щось, Стр),
	_ := console.log(Стр),
	_ := continue_with_span("in_progress", Стр).

написати_втупу(реплікова_ремарка, Щось) :- !,
	flush_output,
	atom_string(Щось, Стр),
	_ := console.log("(" + Стр + ")"),
	_ := continue_with_span("delivery-direction", "(" + Стр + ")").

написати_втупу(дійова_особа, Щось) :- !,
	flush_output,
	atom_string(Щось, Стр),
	_ := console.log(Стр),
	_ := continue_with_span("character", Стр).

заходить(Куди) :-
	% Поновити стиль підсвічування сцени куди прийшли
	стиль_сцени(Куди, Стиль),
	_ := finish_in_progress(Стиль),
	false.

стиль_сцени(трамвай, "tram") :- !.
стиль_сцени(Де, "Carpatians") :- увісні(Де), !.
стиль_сцени(_Де, "Kurenivka").

abort :- !, оповідь("Не підтримується у веб-версії.").

</script>
